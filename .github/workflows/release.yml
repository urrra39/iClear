name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    # Secrets cannot appear in `if`, and a step's own env is not reliably visible to its
    # `if`; these job-level flags say whether signing and notarization are configured.
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --no-parallel
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build (Developer ID if configured, otherwise ad-hoc)
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: scripts/build-release.sh
      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit dist/iClear-*.zip --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple dist/iClear.app
          rm dist/iClear-*.zip
          (cd dist && ditto -c -k --keepParent iClear.app "iClear-${GITHUB_REF_NAME#v}.zip")
      - name: Checksums
        run: cd dist && shasum -a 256 iClear-*.zip iclear-*-macos.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            sed "s/@VERSION@/$VERSION/g" packaging/release-notes.md
            echo
            echo "## SHA256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          # A tag with a suffix (v1.0.0-rc.1) is a pre-release; a plain version tag is a release.
          case "$VERSION" in *-*) KIND="--prerelease" ;; *) KIND="--latest" ;; esac
          gh release create "$GITHUB_REF_NAME" $KIND --title "iClear $VERSION" --notes-file notes.md \
            dist/iClear-*.zip dist/iclear-*-macos.tar.gz dist/SHA256SUMS.txt
