name: CI

on:
  push:
    branches: [main, v1.1, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers && uname -m
      - name: Build
        run: swift build
      - name: Test
        # Serial: GUI suites share focus and the main queue; parallel runs flake on slow runners.
        run: swift test --no-parallel
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests spikes Package.swift
      - name: Universal release build
        if: matrix.runner == 'macos-15'
        run: |
          swift build -c release --arch arm64 --arch x86_64
          lipo -info .build/apple/Products/Release/icleard
